<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Bolha Dev</title>
    <meta name="description" content="jogo em stand by, estamos ajustando" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0a14'/%3E%3Ccircle cx='8' cy='7' r='5' fill='%23ffd54f'/%3E%3C/svg%3E"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b0a14;
        color: #f5e6c8;
        font-family: Rubik, system-ui, sans-serif;
      }
      .standby {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 24px;
      }
      .kicker {
        margin: 0 0 18px;
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #b7ad99;
      }
      .message {
        margin: 0;
        max-width: 16em;
        font-size: clamp(22px, 4vw, 34px);
        font-weight: 600;
        line-height: 1.45;
        color: #ffd54f;
      }
    </style>
  </head>
  <body>
    <main class="standby">
      <p class="kicker">Jogo da Bolha Dev</p>
      <h1 class="message">jogo em stand by, estamos ajustando</h1>
    </main>
  </body>
</html>
