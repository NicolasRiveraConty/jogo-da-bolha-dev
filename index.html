<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Bolha Dev</title>
    <meta name="description" content="Um RPG por turnos em pixel art. Derrote o REAL OFICIAL!" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230b0a14'/%3E%3Crect x='3' y='2' width='10' height='10' fill='%23ffd54f'/%3E%3Crect x='5' y='4' width='2' height='2' fill='%230b0a14'/%3E%3Crect x='9' y='4' width='2' height='2' fill='%230b0a14'/%3E%3Crect x='4' y='8' width='8' height='2' fill='%23ef5350'/%3E%3Crect x='6' y='12' width='4' height='2' fill='%23ffd54f'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0a14;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* Força o carregamento da fonte antes do Phaser desenhar texto */
      #font-preload {
        position: absolute;
        left: -9999px;
        top: -9999px;
        font-family: 'Press Start 2P', monospace;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <span id="font-preload">.</span>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
